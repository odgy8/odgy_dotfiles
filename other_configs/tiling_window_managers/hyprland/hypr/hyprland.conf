# This is an example Hyprland config file. Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
# source = ~/.config/hypr/myColors.conf

#####################################################################################
# got to add in swaync. at 1.08. https://www.youtube.com/watch?v=ftHfRmtqDTU&list=PLDK-KGioYK8rVV5Z0k_eNvabNoL-FQoMv
#####################################################################################



################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# monitor = HDMI-A-2, 1920x1080, 0x0, 1
# monitor = DP-1, 3840x2160, 1920x0, 1.5
# monitor = DP-2, 1920x1080, 4480x0, 1

# monitor = HDMI-A-2, 1920x1080, 0x0, 1
# monitor = DP-1, 2560x1440, 1920x0, 1
# monitor = DP-2, 1920x1080, 4480x0, 1

monitor = DP-2, 1920x1080, 0x0, 1
monitor = DP-1, 1920x1080, 1920x0, 1
monitor = HDMI-A-1, 1920x1080, 3840x0, 1


###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
# $terminal = kitty
$terminal = wezterm
$fileManager = dolphin
# $menu = wofi --show drun
# $menu = ulauncher
$menu = rofi -show drun


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
# exec-once = waybar & hyprpaper & ~/.config/hypr/set-wallpaper.sh 

# Run the stream deck with no ui (functionality without the app opening)
# exec-once = streamdeck --no-ui

exec-once = ags run ~/.config/ags/sambar.tsx
exec = gsettings set org.gnome.desktop.interface color-scheme prefer-dark
exec-once = /home/sam/.local/bin/streamdeck --no-ui
# exec-once = copyq --start-server
exec-once = clipse -listen
exec-once = swaync
exec-once = sleep 5 && surfshark --auto-connect
# Get the mouse to go to the center monitor on startup
exec-once = hyprctl dispatch movecursor 2880 540
exec-once = nwg-dock-hyprland -p bottom -i 24 -s dock.css -mb 4 -d -c "/home/sam/.config/rofi/launchers/type-2/launcher.sh" -o HDMI-A-1
exec-once = nwg-dock-hyprland -p bottom -i 24 -s dock.css -mb 4 -d -c "/home/sam/.config/rofi/launchers/type-2/launcher.sh" -o DP-1 -m
exec-once = nwg-dock-hyprland -p bottom -i 24 -s dock.css -mb 4 -d -c "/home/sam/.config/rofi/launchers/type-2/launcher.sh" -o DP-2 -m

#############################
######## SET WALLPAPER ######
#############################


# exec-once = swaybg -i /home/sam/Pictures/github_coding_images/Owl.png -m fill
exec-once = swaybg -i /home/sam/Pictures/github_coding_images/hyprland_wallpaper_2.png -m fill


#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24

# Dark theme settings
env = GTK_THEME,Adwaita:dark
env = QT_QPA_PLATFORMTHEME,qt5ct
env = QT_STYLE_OVERRIDE,Adwaita-Dark
env = GTK_APPLICATION_PREFER_DARK_THEME,1


###################
### PERMISSIONS ###
###################

# See https://wiki.hyprland.org/Configuring/Permissions/
# Please note permission changes here require a Hyprland restart and are not applied on-the-fly
# for security reasons

# ecosystem {
#   enforce_permissions = 1
# }

# permission = /usr/(bin|local/bin)/grim, screencopy, allow
# permission = /usr/(lib|libexec|lib64)/xdg-desktop-portal-hyprland, screencopy, allow
permission = /usr/(bin|local/bin)/hyprpm, plugin, allow


#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 2
    gaps_out = 0

    border_size = 1

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)

    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 10
    rounding_power = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = true
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    # https://wiki.hyprland.org/Configuring/Variables/#blur
    blur {
        enabled = true
        size = 3
        passes = 1

        vibrancy = 0.1696
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#group
group {
    # Group border colors
    col.border_active = rgba(33ccffee)
    col.border_inactive = rgba(595959aa)
    
    # Groupbar (the tabs/titles)
    groupbar {
        enabled = true
        height = 1
        font_size = 0
        gradients = true
        render_titles = true
        scrolling = true
        
        # Tab colors
        col.active = rgba(33ccffaa)
        col.inactive = rgba(00000000)
        
        text_color = rgba(ffffffff)
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = yes, please :)

    # Default animations, see https://wiki.hyprland.org/Configuring/Animations/ for more

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrule = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrule = rounding 0, floating:0, onworkspace:w[tv1]
# windowrule = bordersize 0, floating:0, onworkspace:f[1]
# windowrule = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
preserve_split = true # You probably want this
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = slave
    orientation = center
    mfact = 0.5
    # new_on_top = true
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true

}

cursor {
    zoom_factor = 1.0
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = gb
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    repeat_rate = 50    # 50Hz = 20ms between repeats
    repeat_delay = 200  # 200ms delay before repeat starts

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.

    # Disable mouse acceleration. It's meant to default to off, but it's deffo on...
    accel_profile = flat

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
# gestures {
#     workspace_swipe = false
# }

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
device {
    name = epic-mouse-v1
    sensitivity = -0.5
}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
# $mainMod = SUPER # Sets "Windows" key as main modifier
$mainMod = ALT # Sets "Alt" key as main modifier

# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
# bind = $mainMod SHIFT, P, exec, surfshark-vpn disconnect && loginctl terminate-user $USER
# bind = CTRL SHIFT, P, exec, surfshark-vpn disconnect 
exec-once = hyprswitch init &

$key = tab
$alt = alt

bind = $alt, $key, exec, hyprswitch gui --mod-key $alt --key $key

bind = CTRL SHIFT, Escape, exit,
bind = $mainMod, Q, killactive
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, G, togglefloating,
bind = $mainMod, F, fullscreen
# bind = $mainMod, space, exec, $menu
bind = $mainMod, space, exec, ~/.config/rofi/launchers/type-2/launcher.sh
bind = $mainMod, P, pin
bind = $mainMod, J, layoutmsg, togglesplit, # dwindle

# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, left, bringactivetotop
bind = $mainMod, right, movefocus, r
bind = $mainMod, right, bringactivetotop
bind = $mainMod, up, movefocus, u
bind = $mainMod, up, bringactivetotop
bind = $mainMod, down, movefocus, d
bind = $mainMod, down, bringactivetotop
# Move focus with mainMod + vim keybindings
bind = $mainMod, h, movefocus, l
bind = $mainMod, h, bringactivetotop
bind = $mainMod, l, movefocus, r
bind = $mainMod, l, bringactivetotop
bind = $mainMod, k, movefocus, u
bind = $mainMod, k, bringactivetotop
bind = $mainMod, j, movefocus, d
bind = $mainMod, j, bringactivetotop
# Move floating window or reorder tiled window with mainMod + shift + vim keybindings
binde = $mainMod SHIFT, h, exec, bash -c '[ "$(hyprctl activewindow -j | jq -r .floating)" = "true" ] && hyprctl dispatch moveactive -30 0 || hyprctl dispatch movewindow l'
binde = $mainMod SHIFT, l, exec, bash -c '[ "$(hyprctl activewindow -j | jq -r .floating)" = "true" ] && hyprctl dispatch moveactive 30 0 || hyprctl dispatch movewindow r'
binde = $mainMod SHIFT, k, exec, bash -c '[ "$(hyprctl activewindow -j | jq -r .floating)" = "true" ] && hyprctl dispatch moveactive 0 -30 || hyprctl dispatch movewindow u'
binde = $mainMod SHIFT, j, exec, bash -c '[ "$(hyprctl activewindow -j | jq -r .floating)" = "true" ] && hyprctl dispatch moveactive 0 30 || hyprctl dispatch movewindow d'

# Cycle through windows in master (stacked) layout with mainMod + Control + j/k
bind = $mainMod CONTROL, j, layoutmsg, cyclenext
bind = $mainMod CONTROL, k, layoutmsg, cycleprev

# Navigate between grouped/tabbed windows
# bind = $mainMod, bracketleft, changegroupactive, b
# bind = $mainMod, bracketright, changegroupactive, f
# I know that these are in the wrong order, but it feels better
bind = $mainMod, k, changegroupactive, b
bind = $mainMod, j, changegroupactive, f

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = CTRL SHIFT SUPER, 4, exec, hyprshot -m region -o ~/Pictures/Screenshots

# Screen recording (wf-recorder) — SUPER+CTRL+SHIFT+R fullscreen, +3 region, +E stop
bind = CTRL SHIFT SUPER, R, exec, bash -c 'notify-send -u low "Recording started" "Full screen — SUPER+CTRL+SHIFT+E to stop" && wf-recorder -o $(hyprctl monitors -j | jq -r ".[] | select(.focused==true) | .name") -f ~/Videos/Recordings/$(date +%Y-%m-%d_%H-%M-%S).mp4'
bind = CTRL SHIFT SUPER, 3, exec, bash -c 'notify-send -u low "Recording started" "Select a region — SUPER+CTRL+SHIFT+E to stop" && wf-recorder -g "$(slurp)" -f ~/Videos/Recordings/$(date +%Y-%m-%d_%H-%M-%S).mp4'
bind = CTRL SHIFT SUPER, E, exec, bash -c 'pkill -INT wf-recorder && notify-send "Recording stopped" "Saved to ~/Videos/Recordings"'

# Clipboard manager
# bind = $mainMod, V, exec, copyq toggle
bind = $mainMod, V, exec, kitty clipse

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Minimize / unminimize
bind = $mainMod, M, movetoworkspacesilent, special:minimized
bind = $mainMod SHIFT, M, togglespecialworkspace, minimized
bind = $mainMod SHIFT, U, movetoworkspace, e+0

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Add a window to a togglegroup
bind = $mainMod SHIFT, G, togglegroup
bind = $mainMod CTRL, h, moveintogroup, l
bind = $mainMod CTRL, j, moveintogroup, d
bind = $mainMod CTRL, k, moveintogroup, u
bind = $mainMod CTRL, l, moveintogroup, r

# Resize active window
binde = $mainMod CTRL SHIFT, h, resizeactive, -20 0
binde = $mainMod CTRL SHIFT, l, resizeactive, 20 0
binde = $mainMod CTRL SHIFT, k, resizeactive, 0 20
binde = $mainMod CTRL SHIFT, j, resizeactive, 0 -20


# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Enter resize mode with Alt+R
bind = $mainMod, R, submap, resize

# Enter layout mode with Alt+Shift+semicolon
bind = $mainMod SHIFT, semicolon, submap, layout

# Layout submap (edit mode)
submap = layout

# Layout options
# bind = , a, exec, hyprctl keyword general:layout dwindle
bind = , a, togglegroup
bind = , a, submap, reset

# bind = , s, exec, hyprctl keyword general:layout master
bind = , s, togglegroup
bind = , s, submap, reset

bind = , g, togglefloating  # Changed to g for floating (like Pop Shell)
bind = , g, submap, reset

bind = , f, fullscreen, 1
bind = , f, submap, reset

bind = , d, togglegroup  # Moved grouping to d
bind = , d, submap, reset

# Additional useful bindings in layout mode
bind = , t, pseudo  # Toggle pseudo-tile
bind = , t, submap, reset

bind = , m, fullscreen, 0  # Maximize
bind = , m, submap, reset

# Exit layout mode with escape or enter
bind = , escape, submap, reset
bind = , return, submap, reset

# Reset to normal mode
submap = reset

# Resize submap
submap = resize

# Resize windows with vim keys
binde = , h, resizeactive, -20 0
binde = , l, resizeactive, 20 0
binde = , k, resizeactive, 0 20
binde = , j, resizeactive, 0 -20

# Resize with arrow keys
binde = , left, resizeactive, -20 0
binde = , right, resizeactive, 20 0
binde = , up, resizeactive, 0 20
binde = , down, resizeactive, 0 -20

# Exit resize mode
bind = , escape, submap, reset
bind = , return, submap, reset

# Reset to normal mode
submap = reset

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule
# windowrule = float,class:^(kitty)$,title:^(kitty)$
# windowrule {
#     name = "copyq"
#     match {
#         class = ^(com.github.hluk.copyq)$
#     }
#     float = 1
#     size = 800 600
# }

# Float all windows by default
windowrule {
  name = "float by default"
  match:class = .*
  float = on
  size = 800 600
}

# Ignore maximize requests from apps. You'll probably like this.
# windowrule = suppressevent maximize, class:.*

# Fix some dragging issues with XWayland
# windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Terminal
bind = $mainMod, Return, exec, kitty

#App Launcher
bind = $mainMod, D, exec, wofi --show drun

# Map monitor and workspaces
# DP-1 = center monitor: 1,2,3
workspace = 1, monitor:DP-1, default:true, persistent:true
workspace = 2, monitor:DP-1
workspace = 3, monitor:DP-1

# DP-2 = left monitor: 4,5,6
workspace = 4, monitor:DP-2, default:true, persistent:true
workspace = 5, monitor:DP-2
workspace = 6, monitor:DP-2

# HDMI-A-1 = right monitor: 7,8,9,0
workspace = 7, monitor:HDMI-A-1, default:true, persistent:true
workspace = 8, monitor:HDMI-A-1
workspace = 9, monitor:HDMI-A-1
workspace = 0, monitor:HDMI-A-1

# Temporary fix for a Hyprland startup race condition where workspaces land on the wrong monitor.
# Hyprland applies workspace rules before monitors are fully ready, so a reload re-applies them
# correctly once everything has settled. Should be removable when Hyprland fixes the init order.
exec-once = sleep 3 && hyprctl reload && hyprctl dispatch workspace 1

exec-once = ~/.local/bin/colorshell

plugin {
    hyprbars {
        bar_height = 20

        hyprbars-button = rgb(ff4040), 10, 󰖭, hyprctl dispatch killactive
        hyprbars-button = rgb(eeee11), 10, 󰖰, if [ "$(hyprctl activewindow -j | jq -r '.workspace.name')" = "special:minimized" ]; then hyprctl dispatch movetoworkspace e+0; else hyprctl dispatch movetoworkspacesilent special:minimized; fi
        hyprbars-button = rgb(00ff7f), 10, , hyprctl dispatch fullscreen 1
    }
}

