$font = sans-serif
$accent = rgba(74, 158, 255, 0.9)
$wallpaper = /home/sam/Pictures/github_coding_images/jellyfish.png

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
  monitor =
  path = $wallpaper

  blur_passes = 3
  blur_size = 7
  noise = 0.0117
  contrast = 0.9
  brightness = 0.65
  vibrancy = 0.1696
  vibrancy_darkness = 0.2
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 92
    font_family = $font
    color = rgba(255, 255, 255, 0.95)

    position = 0, 140
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    font_size = 20
    font_family = $font
    color = rgba(255, 255, 255, 0.6)

    position = 0, 75
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 22%, 6%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.35)

    outer_color = $accent
    check_color = rgba(74, 222, 128, 0.9)
    fail_color = rgba(239, 68, 68, 0.9)

    font_color = rgba(255, 255, 255, 0.85)
    font_family = $font
    placeholder_text = Enter password...
    fail_text = $PAMFAIL$FPRINTFAIL
    fade_on_empty = false
    rounding = 16
    dots_spacing = 0.3

    position = 0, -40
    halign = center
    valign = center
}
